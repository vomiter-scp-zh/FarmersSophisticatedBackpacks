plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
    id 'idea'
    id 'com.vomiter.neoforge-base'
}

vomiterNeoForge {
    modId = mod_id
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: 'gradle/neo-forge-runs.gradle'

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    implementation "curse.maven:sophisticated-backpacks-422301:8845926"
    implementation "curse.maven:sophisticated-core-618298:8838842"
    implementation "curse.maven:farmers-delight-398521:8765184"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
